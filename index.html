<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業日報">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>作業日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app. Fixed bottom tab bar; input flows take over the screen. */
:root{
  --bg:#eceee9;          /* drywall */
  --surface:#fafaf7;
  --ink:#1c262d;
  --muted:#5d686d;
  --line:#d3d7d0;
  --accent:#1d5b88;      /* chalk-line blue */
  --accent-ink:#ffffff;
  --accent-soft:#dbe7f0;
  --ok:#2d7448;
  --warn:#a5560f;
  --warn-soft:#f6e6d4;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719;--surface:#1a2125;--ink:#e4e9e6;--muted:#97a3a6;--line:#2b3539;
    --accent:#72b0de;--accent-ink:#0b1822;--accent-soft:#1d3242;--ok:#6cc08a;--warn:#e5a160;--warn-soft:#3a2a1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121719;--surface:#1a2125;--ink:#e4e9e6;--muted:#97a3a6;--line:#2b3539;
  --accent:#72b0de;--accent-ink:#0b1822;--accent-soft:#1d3242;--ok:#6cc08a;--warn:#e5a160;--warn-soft:#3a2a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.app{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.app.flow{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:18px 10px}
header.top h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.04em}
header.top .date{color:var(--muted);font-size:.95rem}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:1rem;margin:0 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:10px 16px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.big{min-height:72px;font-size:1.15rem;font-weight:700;width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* report fields */
dl.fields{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:8px 12px}
dl.fields dt{color:var(--muted);font-size:.85rem;padding-top:2px}
dl.fields dd{margin:0;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
dl.fields dd.empty{color:var(--muted)}
.qty{display:inline-block;font-family:var(--font-num);font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:4px 6px 0 0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:28px;padding:0}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs button{background:none;border:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px}

/* flow bar */
.flowbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 8px}
.flowbar .title{font-weight:700}

/* voice */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.steps span{flex:none;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);background:var(--surface)}
.steps span.done{color:var(--ok);border-color:var(--ok)}
.steps span.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.question{font-size:1.45rem;font-weight:700;line-height:1.45;text-wrap:balance;margin:6px 0 0}
.heard{min-height:3.2em;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);overflow-wrap:anywhere}
.heard.partial{color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.status.listening .dot{background:var(--ok);animation:pulse 1.1s ease-in-out infinite}
.status.speaking .dot{background:var(--accent)}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
@media (prefers-reduced-motion:reduce){.status.listening .dot{animation:none}}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0}
.hint{font-size:.8rem;color:var(--muted)}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner strong{color:var(--warn)}
.confirmlist button{all:unset;display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%}
.confirmlist button:focus-visible{outline:3px solid var(--accent)}
.confirmlist .k{color:var(--muted);font-size:.85rem;padding-top:2px}
.confirmlist .v{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:500}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;min-height:32px}
.note{font-size:.85rem;color:var(--ok)}
.note.warn{color:var(--warn)}

/* calendar */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{margin:0;font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:.72rem;color:var(--muted);padding:4px 0}
.cal .wd.sun{color:#c0392b}.cal .wd.sat{color:var(--accent)}
.cal button.day{border:1px solid transparent;background:var(--surface);border-radius:8px;min-height:58px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.cal button.day .n{font-family:var(--font-num);font-size:.85rem}
.cal button.day .s{font-size:.62rem;line-height:1.25;color:var(--accent);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.cal button.day.has{background:var(--accent-soft)}
.cal button.day.today{border-color:var(--ink)}
.cal button.day.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cal .blank{min-height:58px}

/* list */
.list{display:flex;flex-direction:column}
.list button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list button:focus-visible{outline:3px solid var(--accent)}
.list .d{font-family:var(--font-num);font-size:.85rem;color:var(--muted);white-space:nowrap}
.list .t{min-width:0;overflow-wrap:anywhere}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tbl td.r,table.tbl th.r{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.bignum{font-family:var(--font-num);font-size:2rem;line-height:1.1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;font-size:.95rem;max-width:calc(100% - 32px)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer img{max-height:100%;object-fit:contain}
.choose-hero{padding-block:24px 8px}
.choose-hero .q{font-size:1.5rem;font-weight:700;margin:0;text-wrap:balance}
ol.howto{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
code.url{display:block;font-family:var(--font-num);font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-wrap:anywhere;user-select:all}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== 日報（今日） ===== -->
  <section id="v-today" class="wrap">
    <header class="top"><h1>作業日報</h1><span class="date" id="today-date"></span></header>
    <div class="stack" id="today-body"></div>
  </section>

  <!-- ===== 入力方法の選択（10時の通知から開く画面） ===== -->
  <section id="v-choose" class="wrap" hidden>
    <div class="flowbar"><span class="title">入力方法の選択</span><button class="btn ghost small" data-act="home">閉じる</button></div>
    <div class="choose-hero stack">
      <span class="label num" id="choose-date"></span>
      <p class="q">作業日報の入力時間です</p>
      <p class="muted small" id="choose-note" style="margin:0"></p>
    </div>
    <div class="stack">
      <button class="btn primary big" data-act="voice">音声で入力</button>
      <button class="btn big" data-act="manual">手動で入力</button>
    </div>
  </section>

  <!-- ===== 音声入力 ===== -->
  <section id="v-voice" class="wrap" hidden>
    <div class="flowbar"><span class="title">音声で入力 <span class="muted small num" id="voice-date"></span></span><button class="btn ghost small" id="voice-exit">中断</button></div>
    <div class="stack">
      <div class="steps" id="voice-steps"></div>
      <div id="voice-banner"></div>
      <p class="question" id="voice-q"></p>
      <div class="status" id="voice-status"><span class="dot"></span><span id="voice-status-text">待機中</span></div>
      <div class="heard" id="voice-heard" aria-live="polite"></div>
      <div id="voice-step-ui"></div>
      <form class="typebox" id="voice-type" autocomplete="off">
        <input type="text" id="voice-type-input" placeholder="文字で答える" enterkeyhint="send">
        <button class="btn" type="submit">送信</button>
      </form>
      <div class="row">
        <button class="btn primary" id="voice-mic" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>話す</button>
        <button class="btn" id="voice-back" type="button">戻る</button>
        <button class="btn" id="voice-skip" type="button">スキップ</button>
        <button class="btn ghost" id="voice-to-manual" type="button">手動入力に切り替え</button>
      </div>
      <p class="hint">話して使える言葉：「戻って」「スキップ」「訂正」（例：住所を訂正）「保存して」「中止」</p>
      <div class="card" id="voice-sofar"><h2>ここまでの内容</h2><dl class="fields" id="voice-sofar-list"></dl></div>
    </div>
    <input type="file" id="voice-photo-input" accept="image/*" multiple hidden>
  </section>

  <!-- ===== 手動入力 ===== -->
  <section id="v-form" class="wrap" hidden>
    <div class="flowbar"><span class="title" id="form-title">手動で入力</span><button class="btn ghost small" id="form-exit">やめる</button></div>
    <form class="stack" id="form" autocomplete="off">
      <div class="card stack">
        <span class="label num" id="form-date"></span>
        <div class="field"><label for="f-weather">天気</label>
          <input type="text" id="f-weather" name="weather_text">
          <div class="chips" id="weather-chips"></div>
        </div>
        <div class="field"><label for="f-site">現場名</label>
          <input type="text" id="f-site" name="site_name" list="site-list">
          <datalist id="site-list"></datalist>
          <div class="row"><button type="button" class="btn small" id="f-inherit">昨日と同じ現場</button><span class="note" id="f-inherit-note"></span></div>
        </div>
        <div class="field"><label for="f-address">現場住所</label><input type="text" id="f-address" name="site_address"></div>
        <div class="field"><label for="f-work">作業内容</label><textarea id="f-work" name="work_description"></textarea></div>
        <div class="field"><label for="f-progress">進捗状況</label><textarea id="f-progress" name="progress_text" placeholder="例：石膏ボード貼り 2階 45㎡ 完了"></textarea><div id="f-qty"></div></div>
        <div class="field"><label for="f-memo">メモ</label><textarea id="f-memo" name="memo_text"></textarea></div>
        <div class="field"><span class="label">写真（任意）</span>
          <div class="thumbs" id="f-thumbs"></div>
          <div class="row"><label class="btn small" for="f-photo-input">写真を追加</label><span class="muted small" id="f-photo-count"></span></div>
          <input type="file" id="f-photo-input" accept="image/*" multiple hidden>
        </div>
      </div>
      <button class="btn primary big" type="submit">保存する</button>
    </form>
  </section>

  <!-- ===== 月間 ===== -->
  <section id="v-month" class="wrap" hidden>
    <header class="top"><h1>月間</h1><span class="date" id="month-count"></span></header>
    <div class="stack">
      <div class="card stack">
        <div class="monthnav"><button class="btn small" id="m-prev" aria-label="前の月">前の月</button><h2 class="num" id="m-title"></h2><button class="btn small" id="m-next" aria-label="次の月">次の月</button></div>
        <div class="cal" id="m-cal"></div>
      </div>
      <div class="card" id="m-detail"></div>
      <div class="card"><h2>この月の日報</h2><div class="list" id="m-list"></div></div>
    </div>
  </section>

  <!-- ===== 集計 ===== -->
  <section id="v-stats" class="wrap" hidden>
    <header class="top"><h1>集計</h1><span class="date">保存済みの日報から</span></header>
    <div class="stack">
      <div class="card stack">
        <div class="grid2">
          <div class="field"><label for="s-site">現場</label><select id="s-site"></select></div>
          <div class="field"><label for="s-period">期間</label><select id="s-period"></select></div>
        </div>
        <div class="row" style="gap:24px">
          <div><div class="label">作業日数</div><div class="bignum" id="s-days">0</div></div>
          <div><div class="label">期間</div><div class="num" id="s-range">―</div></div>
        </div>
        <p class="hint" style="margin:0">集計の項目（取引先別など）は今後決めて追加します。いまは現場別・期間別の絞り込みのみです。</p>
      </div>
      <div class="card"><h2>該当する日報</h2><div class="list" id="s-list"></div></div>
      <div class="card"><h2>現場ごとの作業日数</h2><div class="tblwrap"><table class="tbl" id="s-table"></table></div></div>
      <div class="card stack">
        <h2 style="margin:0">データの保管</h2>
        <p class="small muted" style="margin:0">日報と写真はこのiPhoneのブラウザ内にだけ保存されます。ホーム画面に追加して使い、ときどき書き出してファイルに残してください。</p>
        <div class="row"><button class="btn small" id="d-export">書き出す（JSON）</button><label class="btn small" for="d-import">読み込む</label><input type="file" id="d-import" accept="application/json,.json" hidden></div>
        <span class="small muted" id="d-status"></span>
      </div>
      <div class="card stack" id="notif-card-2"></div>
    </div>
  </section>
</div>

<nav class="tabs" id="tabs">
  <div class="in">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>日報</button>
    <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>月間</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>集計</button>
  </div>
</nav>

<script>
"use strict";
/* ================= 基本ユーティリティ ================= */
const $ = (s, r = document) => r.querySelector(s);
const WD = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const jpDate = s => { const d = parseYmd(s); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const jpDateLong = s => { const d = parseYmd(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const jpDateSpeech = s => { const d = parseYmd(s); return `${d.getMonth()+1}月${d.getDate()}日、${WD[d.getDay()]}曜日です。`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };

const FIELDS = ['weather_text','site_name','site_address','work_description','progress_text','memo_text'];
const LABELS = {weather_text:'天気', site_name:'現場名', site_address:'現場住所', work_description:'作業内容', progress_text:'進捗状況', memo_text:'メモ', photos:'写真'};

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* 進捗から数量・単位を取り出す（例：45㎡、12m、30枚） */
function extractQty(text){
  const out = []; if (!text) return out;
  const re = /(\d+(?:\.\d+)?)\s*(平方メートル|平米|㎡|m2|m²|メートル|ｍ|m|枚|本|箇所|か所|ヶ所|カ所|ケ所|パーセント|％|%)/g;
  const norm = {'平方メートル':'㎡','平米':'㎡','m2':'㎡','m²':'㎡','メートル':'m','ｍ':'m','か所':'箇所','ヶ所':'箇所','カ所':'箇所','ケ所':'箇所','パーセント':'%','％':'%'};
  const src = text.normalize('NFKC').replace(/m\^2/g, 'm2');
  let m; while ((m = re.exec(src)) !== null) {
    out.push({value: Number(m[1]), unit: norm[m[2]] || m[2]});
  }
  return out;
}

/* ================= 保存（IndexedDB：日報と写真を1トランザクションで） ================= */
let dbp = null;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open('sagyo-nippo', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      const s = db.createObjectStore('reports', {keyPath:'id'});
      s.createIndex('work_date', 'work_date', {unique:true});
      db.createObjectStore('photos', {keyPath:'id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = tx => new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
async function allReports(){ const db = await openDB(); const a = await reqP(db.transaction('reports').objectStore('reports').getAll()); return a.sort((x,y) => x.work_date < y.work_date ? -1 : 1); }
async function reportByDate(date){ const db = await openDB(); return reqP(db.transaction('reports').objectStore('reports').index('work_date').get(date)); }
async function getPhotos(ids){ if (!ids || !ids.length) return []; const db = await openDB(); const st = db.transaction('photos').objectStore('photos'); return (await Promise.all(ids.map(id => reqP(st.get(id))))).filter(Boolean); }

async function saveReport(d){
  const db = await openDB();
  const existing = await reportByDate(d.work_date);
  const now = new Date().toISOString();
  const rec = { id: existing ? existing.id : uid(), work_date: d.work_date };
  for (const k of FIELDS) rec[k] = (d[k] || '').trim();
  rec.progress_quantities = extractQty(rec.progress_text);
  rec.photos = d.photos.map(p => p.id);
  rec.created_at = existing ? existing.created_at : now;
  rec.updated_at = now;
  const oldIds = existing ? (existing.photos || []) : [];
  const tx = db.transaction(['reports','photos'], 'readwrite');
  const ps = tx.objectStore('photos');
  for (const p of d.photos) if (p.isNew) ps.put({id:p.id, report_id:rec.id, blob:p.blob, created_at:now});
  for (const id of oldIds) if (!rec.photos.includes(id)) ps.delete(id);
  tx.objectStore('reports').put(rec);
  await txDone(tx);
  d.photos.forEach(p => p.isNew = false);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  return rec;
}

/* 写真：長辺1600pxのJPEGに縮小して保存 */
async function resizePhoto(file){
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
    return blob || file;
  } catch(e) { return file; }
}

function photoUrl(p){ if (!urlCache.has(p.id)) urlCache.set(p.id, URL.createObjectURL(p.blob)); return urlCache.get(p.id); }
function dropUrl(id){ const u = urlCache.get(id); if (u) { URL.revokeObjectURL(u); urlCache.delete(id); } }

const INHERIT_RE = /(昨日|きのう|前の日|前日)(と|の)?(現場と)?(同じ|おなじ|一緒|いっしょ)/;
async function inheritSite(d){
  const prevDate = addDays(d.work_date, -1);
  const prev = await reportByDate(prevDate);
  if (!prev || !prev.site_name) return {status:'none', prevDate};

  return {status:'nameOnly', prevDate};
}

/* ================= 音声対話 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STEPS = [
  {key:'weather_text', short:'天気', q:'今日の天気を教えてください。'},
  {key:'site_name', short:'現場名', q:'今日の現場名は？'},
  {key:'site_address', short:'住所', q:'現場の住所は？'},
  {key:'work_description', short:'作業', q:'今日の作業内容を教えてください。'},
  {key:'progress_text', short:'進捗', q:'どのくらい進みましたか？'},
  {key:'memo_text', short:'メモ', q:'ほかにメモはありますか？'},
  {key:'photos', short:'写真', q:'写真を追加する場合は「写真を追加」を押してください。なければ「なし」と言ってください。'},
  {key:'confirm', short:'確認', q:'内容を確認してください。保存しますか？'},
];
const IDX = Object.fromEntries(STEPS.map((s, i) => [s.key, i]));
const V = {gen:0, idx:0, history:[], rec:null, listening:false, speaking:false, retries:0, broken:'', inherited:false, returnToConfirm:false, awaitingField:false, answered:new Set()};

function speak(text){
  return new Promise(res => {
    if (!('speechSynthesis' in window)) { res(); return; }
    let done = false;
    const fin = () => { if (done) return; done = true; V.speaking = false; renderVoiceStatus(); res(); };
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.rate = 1.05;
      const jv = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').startsWith('ja'));
      if (jv) u.voice = jv;
      u.onend = fin; u.onerror = fin;
      V.speaking = true; renderVoiceStatus();
      speechSynthesis.speak(u);
      setTimeout(fin, 2500 + text.length * 260); // 読み上げ終了イベントが来ない端末への保険
    } catch(e) { fin(); }
  });
}
function stopAll(){ V.gen++; stopListening(); try { speechSynthesis.cancel(); } catch(e) {} V.speaking = false; }
function stopListening(){ const r = V.rec; V.rec = null; V.listening = false; if (r) { try { r.abort(); } catch(e) {} } renderVoiceStatus(); }
function startListening(){
  if (!SR || V.broken) { renderVoiceStatus(); return; }
  stopListening();
  const gen = V.gen;
  const rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = '', gotFinal = false;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) { finalText += r[0].transcript; gotFinal = true; } else interim += r[0].transcript; }
    showHeard(finalText + interim, !gotFinal);
  };
  rec.onerror = e => {
    if (['not-allowed','service-not-allowed','audio-capture'].includes(e.error)) { V.broken = e.error; renderVoice(); }
  };
  rec.onend = () => {
    if (V.rec !== rec) return;
    V.rec = null; V.listening = false; renderVoiceStatus();
    if (gen !== V.gen || V.broken) return;
    if (gotFinal && finalText.trim()) { V.retries = 0; handleAnswer(finalText.trim()); }
    else retry();
  };
  V.rec = rec; V.listening = true; renderVoiceStatus();
  try { rec.start(); } catch(e) { V.rec = null; V.listening = false; renderVoiceStatus(); }
}
async function retry(){
  if (V.retries >= 2) { setHeardHint('聞き取れませんでした。「話す」を押すか、文字で答えてください。'); return; }
  V.retries++;
  say('聞き取れませんでした。もう一度お願いします。');
}
/* 話してから聞き取りを再開する */
async function say(msg){ V.gen++; const g = V.gen; stopListening(); await speak(msg); if (g === V.gen) startListening(); }

async function ask(idx, prefix = ''){
  stopAll(); const g = V.gen;
  V.idx = idx; V.retries = 0; V.awaitingField = false;
  renderVoice();
  showHeard('', false);
  const st = STEPS[idx];
  const q = st.key === 'confirm' ? confirmSpeech() : st.q;
  await speak((prefix ? prefix + ' ' : '') + q);
  if (g === V.gen) startListening();
}
function nextIndex(from){
  let n = from + 1;
  if (STEPS[n] && STEPS[n].key === 'site_address' && V.inherited) n++;
  return n;
}
function goNext(prefix = ''){
  V.answered.add(STEPS[V.idx].key);
  let n = nextIndex(V.idx);
  if (V.returnToConfirm) { V.returnToConfirm = false; n = IDX.confirm; }
  V.history.push(V.idx);
  ask(n, prefix);
}
function goBack(){
  V.returnToConfirm = false;
  if (!V.history.length) { say('これ以上戻れません。'); return; }
  ask(V.history.pop(), '一つ前に戻ります。');
}
function jumpTo(idx, prefix = ''){ V.history.push(V.idx); ask(idx, prefix); }
function fieldFromText(t){
  if (/住所/.test(t)) return IDX.site_address;
  if (/現場/.test(t)) return IDX.site_name;
  if (/天気/.test(t)) return IDX.weather_text;
  if (/作業/.test(t)) return IDX.work_description;
  if (/進捗|進み|しんちょく/.test(t)) return IDX.progress_text;
  if (/メモ/.test(t)) return IDX.memo_text;
  if (/写真/.test(t)) return IDX.photos;
  return -1;
}
function confirmSpeech(){
  const parts = ['内容を確認します。'];
  for (const k of FIELDS) parts.push(`${LABELS[k]}、${D[k] ? D[k] : 'なし'}。`);
  parts.push(`写真、${D.photos.length ? D.photos.length + '枚' : 'なし'}。`);
  parts.push('保存しますか？');
  return parts.join('');
}
const NONE_RE = /^(なし|無し|ない|ありません|特にない|特になし|特にありません|大丈夫|ないです|なしです|結構です)$/;

async function handleAnswer(raw){
  const t = raw.normalize('NFKC').replace(/[。、．,.!！?？\s]+$/g, '').trim();
  stopAll();
  if (!t) return;
  showHeard(raw, false);
  const st = STEPS[V.idx];

  // ---- 発話コマンド ----
  if (/^(中止|中断|やめて|やめる|終了)$/.test(t)) { exitVoice(); return; }
  if (/^(戻って|戻る|もどって|一つ前|ひとつ前|前に戻って)/.test(t)) { goBack(); return; }
  if (/^スキップ/.test(t) && st.key !== 'confirm') { goNext(); return; }
  if (/^(保存して|保存する|保存します|保存|保存お願いします)$/.test(t)) {
    if (st.key === 'confirm') { doVoiceSave(); } else { jumpTo(IDX.confirm, '確認に進みます。'); }
    return;
  }
  if (/(訂正|修正)/.test(t) && t.length <= 16) {
    const f = fieldFromText(t);
    if (f >= 0) { V.returnToConfirm = true; jumpTo(f, `${STEPS[f].short}を訂正します。`); return; }
    if (st.key === 'confirm') { V.awaitingField = true; say('どの項目を訂正しますか？'); return; }
    goBack(); return;
  }
  if (V.awaitingField) {
    const f = fieldFromText(t);
    if (f >= 0) { V.awaitingField = false; V.returnToConfirm = true; jumpTo(f); }
    else say('項目の名前を言ってください。天気、現場名、住所、作業内容、進捗、メモ、写真から選べます。');
    return;
  }

  // ---- 各質問への回答 ----
  switch (st.key) {
    case 'weather_text': case 'site_address': case 'work_description': case 'progress_text':
      D[st.key] = t; goNext(); return;
    case 'memo_text':
      D.memo_text = NONE_RE.test(t) ? '' : t; goNext(); return;
    case 'site_name': {
      const wasInherited = V.inherited;
      if (INHERIT_RE.test(t)) {
        const r = await inheritSite(D);
        if (r.status === 'full') { V.inherited = true; renderVoice(); goNext(`前の日の現場、${D.site_name}、住所、${D.site_address}を引き継ぎました。`); }
        else if (r.status === 'nameOnly') { V.inherited = false; V.answered.add('site_name'); renderVoice(); V.history.push(V.idx); ask(IDX.site_address, `現場名、${D.site_name}を引き継ぎました。前の日の住所が記録されていません。`); }
        else { V.inherited = false; ask(IDX.site_name, '前の日の日報が見つかりません。'); }
        return;
      }
      D.site_name = t; V.inherited = false;
      if (wasInherited) { V.answered.add('site_name'); V.history.push(V.idx); ask(IDX.site_address); return; } // 現場を変えたら住所も聞き直す
      goNext(); return;
    }
    case 'photos':
      if (NONE_RE.test(t) || /^(次|次へ|つぎ|いらない|要らない|追加しない|終わり|おわり|以上|ok|オッケー|OK)/i.test(t)) { goNext(); return; }
      if (/(追加|撮る|とる|写真)/.test(t)) { say('画面の「写真を追加」ボタンを押してください。'); return; }
      say('写真を追加しない場合は「なし」と言ってください。'); return;
    case 'confirm':
      if (/^(はい|お願いします|オッケー|OK|ok|いいです|大丈夫)/.test(t)) { doVoiceSave(); return; }
      say('保存する場合は「保存して」、直す場合は「訂正」と言ってください。'); return;
  }
}

async function startVoice(date){

/* ---- 音声画面の描画 ---- */
function renderVoiceStatus(){
  const s = $('#voice-status'); if (!s) return;
  s.classList.toggle('listening', V.listening); s.classList.toggle('speaking', V.speaking && !V.listening);
  $('#voice-status-text').textContent = V.listening ? '聞いています…' : V.speaking ? '読み上げ中' : (!SR || V.broken) ? '音声認識は使えません（文字で答えられます）' : '待機中';
}
function showHeard(text, partial){ const h = $('#voice-heard'); h.textContent = text; h.classList.toggle('partial', !!partial); }
function setHeardHint(text){ const h = $('#voice-heard'); h.textContent = text; h.classList.add('partial'); }
function renderVoice(){
  const st = STEPS[V.idx];
  $('#voice-steps').innerHTML = STEPS.map((s, i) => {
    const skipped = s.key === 'site_address' && V.inherited;
    const cls = i === V.idx ? 'now' : (V.answered.has(s.key) || skipped) ? 'done' : '';
    return `<span class="${cls}">${s.short}${skipped ? '（引継ぎ）' : ''}</span>`;
  }).join('');
  let banner = '';
  if (!SR) banner = '<div class="banner"><strong>この端末では音声認識が使えません。</strong>質問の読み上げに文字で答えるか、手動入力に切り替えてください。</div>';
  else if (V.broken) banner = '<div class="banner"><strong>マイクが使えません。</strong>iPhoneの「設定」→「Safari」→「マイク」で許可するか、手動入力に切り替えてください。ここまでの内容は引き継がれます。</div>';
  $('#voice-banner').innerHTML = banner;
  $('#voice-q').textContent = st.key === 'confirm' ? '保存しますか？' : st.q;
  $('#voice-skip').hidden = st.key === 'confirm';
  $('#voice-mic').hidden = !SR || !!V.broken;

  const ui = $('#voice-step-ui');
  if (st.key === 'photos') {
    ui.innerHTML = `<div class="stack"><div class="thumbs">${D.photos.map(p => `<div class="thumb"><img alt="" src="${esc(photoUrl(p))}"><button class="x" type="button" data-rm="${p.id}" aria-label="この写真を外す">×</button></div>`).join('')}</div>
      <div class="grid2"><label class="btn primary" for="voice-photo-input">写真を追加</label><button class="btn" type="button" id="voice-photo-next">${D.photos.length ? '次へ' : '写真なしで次へ'}</button></div></div>`;
    $('#voice-photo-next').onclick = () => { stopAll(); goNext(); };
  } else if (st.key === 'confirm') {
    let h = '<div class="card confirmlist"><p class="hint" style="margin:0 0 4px">項目を押すと、その項目だけ言い直せます。</p>';
    for (const k of FIELDS) h += `<button type="button" data-fix="${IDX[k === 'site_address' ? 'site_address' : k]}"><span class="k">${LABELS[k]}</span><span class="v">${D[k] ? esc(D[k]) : '<span class="muted">未入力</span>'}</span></button>`;
    h += `<button type="button" data-fix="${IDX.photos}"><span class="k">写真</span><span class="v">${D.photos.length ? D.photos.length + '枚' : '<span class="muted">なし</span>'}</span></button></div>
      <div class="grid2"><button class="btn primary big" type="button" id="voice-save">保存する</button><button class="btn big" type="button" id="voice-edit-manual">手動で修正</button></div>`;
    ui.innerHTML = h;
    $('#voice-save').onclick = doVoiceSave;
    $('#voice-edit-manual').onclick = () => { stopAll(); openForm(D.work_date, true); };
  } else ui.innerHTML = '';

  $('#voice-sofar').hidden = st.key === 'confirm';
  let s = '';
  for (const k of FIELDS) s += `<dt>${LABELS[k]}</dt><dd class="${D[k] ? '' : 'empty'}">${D[k] ? esc(D[k]) : '―'}</dd>`;
  s += `<dt>写真</dt><dd class="${D.photos.length ? '' : 'empty'}">${D.photos.length ? D.photos.length + '枚' : '―'}</dd>`;
  $('#voice-sofar-list').innerHTML = s;
  renderVoiceStatus();
}
$('#voice-step-ui').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { D.photos = D.photos.filter(p => p.id !== rm.dataset.rm); dropUrl(rm.dataset.rm); renderVoice(); return; }
  const fx = e.target.closest('[data-fix]');
  if (fx) { V.returnToConfirm = true; jumpTo(Number(fx.dataset.fix)); }
});
$('#voice-photo-input').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  stopAll();
  for (const f of files) D.photos.push({id:uid(), blob: await resizePhoto(f), isNew:true});
  renderVoice();
  say(`写真を${files.length}枚追加しました。ほかにもあれば追加してください。終わったら「次へ」と言ってください。`);
});
$('#voice-type').addEventListener('submit', e => { e.preventDefault(); const i = $('#voice-type-input'); const v = i.value; i.value = ''; if (v.trim()) handleAnswer(v); });
$('#voice-mic').addEventListener('click', () => { stopAll(); V.retries = 0; showHeard('', false); startListening(); });
$('#voice-back').addEventListener('click', goBack);
$('#voice-skip').addEventListener('click', () => goNext());
$('#voice-exit').addEventListener('click', exitVoice);
$('#voice-to-manual').addEventListener('click', () => { stopAll(); openForm(D.work_date, true); });

/* ================= 手動入力 ================= */
const WEATHER = ['晴れ','曇り','雨','雪','晴れのち曇り','曇りのち雨'];
let formFromVoice = false;
async function openForm(date, keepDraft = false){
  formFromVoice = keepDraft;
  if (!keepDraft || !D || D.work_date !== date) D = await loadDraft(date);
  $('#form-title').textContent = D.existing ? '日報を修正' : '手動で入力';
  $('#form-date').textContent = jpDateLong(date);
  const f = $('#form');
  for (const k of FIELDS) f.elements[k].value = D[k] || '';
  $('#f-inherit-note').textContent = ''; $('#f-inherit-note').className = 'note';
  $('#weather-chips').innerHTML = WEATHER.map(w => `<button type="button" class="chip" data-w="${w}">${w}</button>`).join('');
  const sites = [...new Set((await allReports()).map(r => r.site_name).filter(Boolean))];
  $('#site-list').innerHTML = sites.map(s => `<option value="${esc(s)}"></option>`).join('');
  renderFormPhotos(); renderQty();
  show('form');
}
function readForm(){ const f = $('#form'); for (const k of FIELDS) D[k] = f.elements[k].value; }
function renderFormPhotos(){
  $('#f-thumbs').innerHTML = D.photos.map(p => `<div class="thumb"><img alt="" src="${esc(photoUrl(p))}"><button class="x" type="button" data-rm="${p.id}" aria-label="この写真を外す">×</button></div>`).join('');
  $('#f-photo-count').textContent = D.photos.length ? `${D.photos.length}枚` : '写真なしでも保存できます';
}
function renderQty(){ const q = extractQty($('#f-progress').value); $('#f-qty').innerHTML = q.map(x => `<span class="qty">${x.value} ${esc(x.unit)}</span>`).join(''); }
$('#f-progress').addEventListener('input', renderQty);
$('#weather-chips').addEventListener('click', e => { const c = e.target.closest('[data-w]'); if (c) $('#f-weather').value = c.dataset.w; });
$('#f-thumbs').addEventListener('click', e => { const rm = e.target.closest('[data-rm]'); if (rm) { D.photos = D.photos.filter(p => p.id !== rm.dataset.rm); dropUrl(rm.dataset.rm); renderFormPhotos(); } });
$('#f-photo-input').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) D.photos.push({id:uid(), blob: await resizePhoto(f), isNew:true});
  renderFormPhotos();
});
async function formInherit(){
  readForm();
  const r = await inheritSite(D);
  const note = $('#f-inherit-note');
  if (r.status === 'none') { note.className = 'note warn'; note.textContent = `${jpDate(r.prevDate)}の日報が見つかりません。現場名と住所を入力してください。`; if (INHERIT_RE.test(D.site_name)) { D.site_name = ''; } }
  else if (r.status === 'nameOnly') { note.className = 'note warn'; note.textContent = `${jpDate(r.prevDate)}の現場名を入れました。住所は記録がないので入力してください。`; }
  else { note.className = 'note'; note.textContent = `${jpDate(r.prevDate)}の現場名と住所を入れました。`; }
  $('#f-site').value = D.site_name; $('#f-address').value = D.site_address;
}
$('#f-inherit').addEventListener('click', formInherit);
$('#f-site').addEventListener('change', () => { if (INHERIT_RE.test($('#f-site').value)) formInherit(); });
$('#form').addEventListener('submit', async e => {
  e.preventDefault(); readForm();
  if (INHERIT_RE.test(D.site_name)) { await formInherit(); return; }
  try { await saveReport(D); } catch(err) { toast('保存できませんでした。もう一度お試しください'); return; }
  const date = D.work_date; D = null; toast('保存しました');
  if (date === todayStr()) show('today'); else { monthCursor = date.slice(0,7); selDate = date; show('month'); }
});
$('#form-exit').addEventListener('click', () => { readForm(); show(currentTab === 'month' ? 'month' : 'today'); });

/* ================= 月間 ================= */
let monthCursor = todayStr().slice(0,7), selDate = todayStr();
async function renderMonth(){
  const [y, m] = monthCursor.split('-').map(Number);
  $('#m-title').textContent = `${y}年${m}月`;
  const reps = (await allReports()).filter(r => r.work_date.startsWith(monthCursor));
  const byDate = Object.fromEntries(reps.map(r => [r.work_date, r]));
  $('#month-count').textContent = `${reps.length}件`;
  const first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate(), today = todayStr();
  let h = WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div class="blank"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${monthCursor}-${pad(d)}`, r = byDate[ds];
    h += `<button class="day ${r ? 'has' : ''} ${ds === today ? 'today' : ''} ${ds === selDate ? 'sel' : ''}" data-day="${ds}" aria-label="${jpDate(ds)}${r ? ' 日報あり' : ''}"><span class="n">${d}</span>${r ? `<span class="s">${esc(r.site_name || '日報あり')}</span>` : ''}</button>`;
  }
  $('#m-cal').innerHTML = h;
  $('#m-list').innerHTML = reps.length ? reps.slice().reverse().map(r => `<button data-day="${r.work_date}"><span class="d">${jpDate(r.work_date)}</span><span class="t">${esc(r.site_name || '現場名なし')}<br><span class="muted small">${esc(r.work_description || '')}</span></span></button>`).join('') : '<p class="muted small" style="margin:0">この月の日報はありません。</p>';
  renderDetail(selDate.startsWith(monthCursor) ? byDate[selDate] : null);
}
async function renderDetail(r){
  const box = $('#m-detail');
  if (!selDate.startsWith(monthCursor)) { box.innerHTML = '<p class="muted small" style="margin:0">日付を選ぶと日報を表示します。</p>'; return; }
  if (!r) { box.innerHTML = `<h2>${jpDateLong(selDate)}</h2><p class="muted small" style="margin:0">この日の日報はありません。</p>`; return; }
  box.innerHTML = `<h2>${jpDateLong(selDate)}</h2>${reportFieldsHTML(r)}${await photosHTML(r.photos)}<div class="row" style="margin-top:14px"><button class="btn primary" id="m-edit">修正する</button></div>`;
  $('#m-edit').onclick = () => openForm(selDate);
}
$('#m-cal').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) { selDate = b.dataset.day; renderMonth(); } });
$('#m-list').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) { selDate = b.dataset.day; renderMonth(); $('#m-detail').scrollIntoView({behavior:'smooth', block:'start'}); } });
const shiftMonth = n => { const [y, m] = monthCursor.split('-').map(Number); const d = new Date(y, m-1+n, 1); monthCursor = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; renderMonth(); };
$('#m-prev').addEventListener('click', () => shiftMonth(-1));
$('#m-next').addEventListener('click', () => shiftMonth(1));

/* ================= 集計 ================= */
const NOSITE = '（現場名なし）';
async function renderStats(keep = false){
  const reps = await allReports();
  const sSel = $('#s-site'), pSel = $('#s-period');
  if (!keep) {
    const prevS = sSel.value, prevP = pSel.value;
    const counts = {};
    for (const r of reps) { const k = r.site_name || NOSITE; counts[k] = (counts[k] || 0) + 1; }
    const sites = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    sSel.innerHTML = `<option value="">すべての現場</option>` + sites.map(s => `<option value="${esc(s)}">${esc(s)}（${counts[s]}日）</option>`).join('');
    const months = [...new Set(reps.map(r => r.work_date.slice(0,7)))].sort().reverse();
    pSel.innerHTML = `<option value="">全期間</option>` + months.map(mo => `<option value="${mo}">${mo.replace('-', '年')}月</option>`).join('');
    if ([...sSel.options].some(o => o.value === prevS)) sSel.value = prevS;
    if ([...pSel.options].some(o => o.value === prevP)) pSel.value = prevP;
  }
  const site = sSel.value, period = pSel.value;
  const hit = reps.filter(r => (!site || (r.site_name || NOSITE) === site) && (!period || r.work_date.startsWith(period)));
  $('#s-days').textContent = hit.length;
  $('#s-range').textContent = hit.length ? `${jpDate(hit[0].work_date)} 〜 ${jpDate(hit[hit.length-1].work_date)}` : '―';
  $('#s-list').innerHTML = hit.length ? hit.slice().reverse().map(r => `<button data-goto="${r.work_date}"><span class="d">${jpDate(r.work_date)}</span><span class="t">${esc(r.site_name || NOSITE)}<br><span class="muted small">${esc(r.work_description || '')}${r.progress_text ? '／' + esc(r.progress_text) : ''}</span></span></button>`).join('') : '<p class="muted small" style="margin:0">該当する日報はありません。</p>';
  const agg = {};
  for (const r of reps.filter(r => !period || r.work_date.startsWith(period))) {
    const k = r.site_name || NOSITE; agg[k] = agg[k] || {n:0, last:''}; agg[k].n++; if (r.work_date > agg[k].last) agg[k].last = r.work_date;
  }
  const rows = Object.entries(agg).sort((a, b) => b[1].n - a[1].n);
  $('#s-table').innerHTML = rows.length ? `<thead><tr><th>現場名</th><th class="r">日数</th><th class="r">最終日</th></tr></thead><tbody>` + rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r">${v.last.slice(5).replace('-', '/')}</td></tr>`).join('') + '</tbody>' : '<tbody><tr><td class="muted">まだ日報がありません。</td></tr></tbody>';
  $('#notif-card-2').innerHTML = notifHTML();
}
$('#s-site').addEventListener('change', () => renderStats(true));
$('#s-period').addEventListener('change', () => renderStats(true));

/* ================= 書き出し・読み込み ================= */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
$('#d-export').addEventListener('click', async () => {
  const st = $('#d-status'); st.textContent = '書き出し中…';
  try {
    const db = await openDB();
    const reps = await allReports();
    const photos = await reqP(db.transaction('photos').objectStore('photos').getAll());
    const ph = await Promise.all(photos.map(async p => ({id:p.id, report_id:p.report_id, created_at:p.created_at, data: await blobToDataURL(p.blob)})));
    const blob = new Blob([JSON.stringify({app:'sagyo-nippo', version:1, exported_at:new Date().toISOString(), reports:reps, photos:ph})], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `作業日報_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    st.textContent = `日報${reps.length}件・写真${ph.length}枚を書き出しました。`;
  } catch(e) { st.textContent = '書き出せませんでした。'; }
});
$('#d-import').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const st = $('#d-status'); st.textContent = '読み込み中…';
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'sagyo-nippo') throw new Error('format');
    const blobs = await Promise.all((data.photos || []).map(async p => ({id:p.id, report_id:p.report_id, created_at:p.created_at, blob: await (await fetch(p.data)).blob()})));
    const db = await openDB();
    const existing = await allReports();
    const tx = db.transaction(['reports','photos'], 'readwrite');
    const rs = tx.objectStore('reports'), ps = tx.objectStore('photos');
    for (const r of data.reports || []) {
      const same = existing.find(x => x.work_date === r.work_date && x.id !== r.id);
      if (same) { rs.delete(same.id); for (const id of same.photos || []) ps.delete(id); }
      rs.put(r);
    }
    for (const p of blobs) ps.put(p);
    await txDone(tx);
    st.textContent = `日報${(data.reports || []).length}件を読み込みました（同じ日付の日報は置き換えました）。`;
    renderStats();
  } catch(err) { st.textContent = 'このファイルは読み込めません。このアプリで書き出したJSONを選んでください。'; }
});

/* ================= 起動 ================= */
function route(){
  if (location.hash === '#start') { history.replaceState(null, '', location.pathname + location.search); openChoose(); }
}
window.addEventListener('hashchange', route);
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e) {} }
show('today');
route();
</script>
</body>
